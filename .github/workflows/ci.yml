name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Apply targeted format fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/reports/runtime_fixes_round2.py')
          text = path.read_text()
          old = '''    explicit_selection = any(\n        row.get("include_explicit") or "include_in_report" in row for row in selected\n    )\n'''
          new = '''    explicit_selection = any(row.get("include_explicit") is True for row in selected)\n'''
          if old not in text:
              raise SystemExit('explicit selection block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          ruff format apps/reports/runtime_fixes_round2.py tests/test_report_polish_round2_20260905.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/reports/runtime_fixes_round2.py tests/test_report_polish_round2_20260905.py
          git commit -m "Исправить совместимость выбора месяцев и форматирование"
          git push origin HEAD:${{ github.head_ref }}
          exit 1

  docker:
    name: Docker and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: echo "Ожидаем коммит форматирования"
