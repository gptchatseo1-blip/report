name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Django system check
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest

  docker:
    name: Docker and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start services
        run: docker compose up --build -d

      - name: Wait for application health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/health/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1

      - name: Django checks in container
        run: |
          docker compose exec -T web python manage.py check
          docker compose exec -T web python manage.py makemigrations --check --dry-run

      - name: Run tests against PostgreSQL
        run: docker compose exec -T web pytest

      - name: Generate and smoke-test real report exports
        run: |
          docker compose exec -T web python manage.py export_smoke_demo --output /app/demo-artifacts
          mkdir -p demo-artifacts
          docker compose cp web:/app/demo-artifacts/. demo-artifacts/

      - name: Upload visual export samples
        uses: actions/upload-artifact@v4
        with:
          name: anonymised-report-export-samples
          path: |
            demo-artifacts/seo-demo.docx
            demo-artifacts/seo-demo.pdf
            demo-artifacts/seo-demo.xlsx
            demo-artifacts/seo-demo.png
          if-no-files-found: error
          retention-days: 14

      - name: Show service logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down --volumes
