{% load static %}<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}SEO-отчёты{% endblock %}</title><link rel="stylesheet" href="{% static 'reports/app.css' %}"><script src="https://unpkg.com/htmx.org@2.0.4" defer></script></head>
<body><header><a class="brand" href="{% url 'reports:projects' %}">SEO-отчёты</a><nav><a href="{% url 'reports:projects' %}">Проекты</a>{% if project %}<a href="{% url 'reports:report-list' project.id %}">Отчёты</a><strong>{{ project.name }}</strong>{% endif %}<form method="post" action="{% url 'admin:logout' %}">{% csrf_token %}<button class="nav-button">Выйти</button></form></nav></header><main>
{% for message in messages %}<div class="notice">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
